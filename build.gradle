/*
 * This file was generated by the Gradle 'init' task.
 * Modified for TaskManager project: added JavaFX and Jackson dependencies.
 */

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = "21.0.6"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JavaFX modules
    implementation libs.javafx.controls
    implementation libs.javafx.fxml
    implementation libs.javafx.base

    // Jackson for JSON processing
    implementation libs.jackson.databind
    // Jackson modules for Java 8 date/time support
    implementation libs.jackson.jsr310

    // This dependency is used by the application (kept from original).
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.gestortareas.App'

    // JVM arguments for JavaFX
    applicationDefaultJvmArgs = [
        '--add-modules', 'javafx.controls,javafx.fxml',
        '--add-exports', 'javafx.graphics/com.sun.javafx.application=ALL-UNNAMED'
    ]
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
